<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente</title>
 
    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
 
    <!-- Estilos próprios (por cima do Bootstrap) -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
 
<body data-page="cliente">
    <button id="tema">🌙</button>
 
<header>
    <div class="container topo">
 
        <div class="logo-area">
            <img src="../Imagens/1.png" class="logo">
            <h1>Área do Cliente</h1>
        </div>
 
        <nav>
            <a href="#" id="btnSair">Sair</a>
        </nav>
 
    </div>
</header>
 
<main class="container">
 
    <section class="card">
        <h2 id="boasVindas">Olá!</h2>
        <p>Bem-vindo à área do cliente.</p>
    </section>
 
    <!-- Navegação por abas (Bootstrap) -->
    <ul class="nav nav-tabs" id="abasCliente" role="tablist">
        <li class="nav-item" role="presentation">
            <button
                class="nav-link active"
                id="tab-dados-btn"
                data-bs-toggle="tab"
                data-bs-target="#aba-dados"
                type="button"
                role="tab"
                aria-controls="aba-dados"
                aria-selected="true">
                Meus Dados
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button
                class="nav-link"
                id="tab-agendamento-btn"
                data-bs-toggle="tab"
                data-bs-target="#aba-agendamento"
                type="button"
                role="tab"
                aria-controls="aba-agendamento"
                aria-selected="false">
                Agendamento
            </button>
        </li>
    </ul>
 
    <div class="tab-content" id="abasClienteConteudo">
 
        <!-- ABA: Meus Dados -->
        <div
            class="tab-pane fade show active card secao"
            id="aba-dados"
            role="tabpanel"
            aria-labelledby="tab-dados-btn">
 
            <h2>Meus Dados</h2>
 
            <form id="form-cliente" class="form-grid">
 
                <input type="hidden" id="cliente-id">
 
                <div>
                    <label for="cliente-nome">Nome</label>
                    <input type="text" id="cliente-nome" required>
                </div>
 
                <div>
                    <label for="cliente-telefone">Telefone</label>
                    <input type="text" id="cliente-telefone" required>
                </div>
 
                <div class="full botoes">
                    <button type="submit">Salvar meus dados</button>
 
                    <button
                        type="button"
                        id="cancelar-cliente"
                        class="perigo">
                        Cancelar
                    </button>
                </div>
 
                <div class="tabela-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
 
                        <tbody id="lista-clientes">
                        </tbody>
                    </table>
                </div>
 
            </form>
        </div>
 
        <!-- ABA: Agendamento -->
        <div
            class="tab-pane fade card secao"
            id="aba-agendamento"
            role="tabpanel"
            aria-labelledby="tab-agendamento-btn">
 
            <h2>Agendamento</h2>
 
            <form id="form-agendamento" class="form-grid">
 
                <input type="hidden" id="agendamento-id">
 
                <div>
                    <label for="agendamento-data">Data</label>
                    <input type="date" id="agendamento-data" required>
                </div>
 
                <div>
                    <label for="agendamento-horario">Horário</label>
                    <select id="agendamento-horario" required disabled>
                        <option value="">Selecione data e funcionário</option>
                    </select>
                </div>

                <div>
                    <label for="agendamento-cliente">Cliente</label>
                    <select id="agendamento-cliente" required>
                        <option value="">Selecione</option>
                    </select>
                </div>
 
                <div>
                    <label for="agendamento-servico">Serviço</label>
                    <select id="agendamento-servico" required>
                        <option value="">Selecione</option>
                    </select>
                </div>
 
                <div class="full">
                    <label for="agendamento-funcionario">Funcionário</label>
                    <select id="agendamento-funcionario" required>
                        <option value="">Selecione</option>
                    </select>
                </div>
 
                <div class="full botoes">
                    <button type="submit">Agendar</button>
 
                    <button type="button" id="verificar-disponibilidade">
                        Ver disponibilidade
                    </button>
                    <button
                        type="button"
                        id="cancelar-agendamento"
                        class="perigo">
                        Cancelar
                    </button>
                </div>
 
            </form>
 
            <div>
                <h3>Horários ocupados</h3>
                <ul id="lista-disponibilidade" class="lista-disponibilidade"></ul>
            </div>
 
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
 
                    <tbody id="lista-clientes-agendamento">
                    </tbody>
                </table>
            </div>
 
        </div>
 
    </div>
 
</main>
 
<script>
 
    const nome = localStorage.getItem("nome");
 
    if(nome){
        document.getElementById("boasVindas").innerText =
            `Olá, ${nome}!`;
    }
 
    document.getElementById("btnSair")
    .addEventListener("click", () => {
 
        localStorage.removeItem("nome");
        localStorage.removeItem("tipo");
 
        window.location.href = "login.html";
    });
 
 
</script>
 
<!-- Bootstrap JS (necessário para as abas funcionarem) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
<script src="../js/app.js"></script>
 
</body>
</html>
