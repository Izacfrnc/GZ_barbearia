<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Barbearia - Cadastro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body data-page="dashboard">
    <button id="tema">🌙</button>

    <header>
      <div class="container topo">
        <div class="logo-area">
          <img src="../Imagens/1.png" class="logo" />

          <h1>Cadastro</h1>
        </div>

        <nav>
          <a href="index.html">Relatório</a>
          <a href="dashboard.html">Cadastro</a>
        </nav>
      </div>
    </header>

    <main class="container mt-4">
      <ul class="nav nav-tabs mb-4" id="tabsCadastro">
        <li class="nav-item">
          <button
            class="nav-link active"
            data-bs-toggle="tab"
            data-bs-target="#clientes"
          >
            Clientes
          </button>
        </li>

        <li class="nav-item">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#funcionarios"
          >
            Funcionários
          </button>
        </li>

        <li class="nav-item">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#servicos"
          >
            Serviços
          </button>
        </li>

        <li class="nav-item">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#agendamentos"
          >
            Agendamentos
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="clientes">
          <section class="card secao">
            <h2>Clientes</h2>

            <form id="form-cliente" class="form-grid">
              <input type="hidden" id="cliente-id" />

              <div>
                <label for="cliente-nome">Nome</label>

                <input type="text" id="cliente-nome" required />
              </div>

              <div>
                <label for="cliente-telefone">Telefone</label>

                <input type="text" id="cliente-telefone" required />
              </div>

              <div class="full botoes">
                <button type="submit">Salvar Cliente</button>

                <button type="button" id="cancelar-cliente" class="perigo">
                  Cancelar
                </button>
              </div>
            </form>

            <div class="tabela-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>

                    <th>Nome</th>

                    <th>Telefone</th>

                    <th width="180">Ações</th>
                  </tr>
                </thead>

                <tbody id="lista-clientes">
                  <tr>
                    <td colspan="4" class="mensagem-vazia">Carregando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
        <div class="tab-pane fade" id="funcionarios">
          <section class="card secao">
            <h2>Funcionários</h2>

            <form id="form-funcionario" class="form-grid">
              <input type="hidden" id="funcionario-id" />

              <div class="full">
                <label for="funcionario-nome"> Nome </label>

                <input type="text" id="funcionario-nome" required />
              </div>

              <div class="full botoes">
                <button type="submit">Salvar Funcionário</button>

                <button type="button" id="cancelar-funcionario" class="perigo">
                  Cancelar
                </button>
              </div>
            </form>

            <div class="tabela-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>

                    <th>Nome</th>

                    <th width="180">Ações</th>
                  </tr>
                </thead>

                <tbody id="lista-funcionarios">
                  <tr>
                    <td colspan="3" class="mensagem-vazia">Carregando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
        <div class="tab-pane fade" id="servicos">
          <section class="card secao">
            <h2>Serviços</h2>

            <form id="form-servico" class="form-grid">
              <input type="hidden" id="servico-id" />

              <div class="full">
                <label for="servico-tipo"> Tipo do serviço </label>

                <input type="text" id="servico-tipo" required />
              </div>

              <div class="full botoes">
                <button type="submit">Salvar Serviço</button>

                <button type="button" id="cancelar-servico" class="perigo">
                  Cancelar
                </button>
              </div>
            </form>

            <div class="tabela-wrap">
              <table class="table table-hover table-striped align-middle">
                <thead>
                  <tr>
                    <th>ID</th>

                    <th>Serviço</th>

                    <th width="180">Ações</th>
                  </tr>
                </thead>

                <tbody id="lista-servicos">
                  <tr>
                    <td colspan="3" class="mensagem-vazia">Carregando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
        <div class="tab-pane fade" id="agendamentos">
          <section class="card secao">
            <h2>Agendamentos</h2>

            <form id="form-agendamento" class="form-grid">
              <input type="hidden" id="agendamento-id" />

              <div>
                <label for="agendamento-data"> Data </label>

                <input type="date" id="agendamento-data" required />
              </div>

              <div>
                <label for="agendamento-horario"> Horário </label>

                <input type="time" id="agendamento-horario" required step="1800" min="07:30" max="19:00" />
              </div>

              <div>
                <label for="agendamento-cliente"> Cliente </label>

                <select id="agendamento-cliente" required>
                  <option value="">Selecione</option>
                </select>
              </div>

              <div>
                <label for="agendamento-servico"> Serviço </label>

                <select id="agendamento-servico" required>
                  <option value="">Selecione</option>
                </select>
              </div>

              <div class="full">
                <label for="agendamento-funcionario"> Funcionário </label>

                <select id="agendamento-funcionario" required>
                  <option value="">Selecione</option>
                </select>
              </div>

              <div class="full botoes">
                <button type="submit">Salvar Agendamento</button>

                <button type="button" id="verificar-disponibilidade">
                  Ver disponibilidade
                </button>

                <button type="button" id="cancelar-agendamento" class="perigo">
                  Cancelar
                </button>
              </div>
            </form>

            <hr />

            <h5>Horários ocupados</h5>

            <ul id="lista-disponibilidade" class="lista-disponibilidade"></ul>

            <div class="tabela-wrap mt-4">
              <table class="table table-hover table-striped align-middle">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Cliente</th>
                    <th>Serviço</th>
                    <th>Funcionário</th>
                    <th width="180">Ações</th>
                  </tr>
                </thead>

                <tbody id="lista-agendamentos">
                  <tr>
                    <td colspan="7" class="mensagem-vazia">Carregando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
